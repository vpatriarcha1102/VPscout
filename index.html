<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>VPScouts</title>
    <meta name="description" content="Plataforma de scout de futsal — jogos, treinos, atletas e estatísticas." />
    <meta name="theme-color" content="#000000" />

    <!-- PWA: instalar na tela inicial -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />

    <!-- iOS: comportamento de app em tela cheia ao instalar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VPScouts" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Rede de segurança contra tela branca travada. Fica FORA do bundle
         React de propósito: se o main.jsx falhar ao carregar (ex: cache
         antigo do celular apontando pra um arquivo que já não existe mais
         depois de um novo deploy), esse script roda mesmo assim, porque
         está direto no HTML.
         1) Se um script/arquivo falhar ao carregar, força recarregar a
            página UMA vez (com um jeito de evitar loop infinito).
         2) Se depois de alguns segundos a tela continuar vazia, mostra um
            botão pra recarregar do zero, limpando o cache do app. -->
    <script>
      (function () {
        var CHAVE = "vpscouts_recarregou_uma_vez";
        window.addEventListener(
          "error",
          function (e) {
            var alvo = e.target;
            if (alvo && (alvo.tagName === "SCRIPT" || alvo.tagName === "LINK")) {
              if (!sessionStorage.getItem(CHAVE)) {
                sessionStorage.setItem(CHAVE, "1");
                location.reload();
              }
            }
          },
          true
        );

        setTimeout(function () {
          var raiz = document.getElementById("root");
          if (raiz && raiz.childElementCount === 0) {
            raiz.innerHTML =
              '<div style="min-height:100vh;background:#0B0E11;color:#EAF6F8;' +
              'font-family:-apple-system,system-ui,sans-serif;display:flex;' +
              'flex-direction:column;align-items:center;justify-content:center;' +
              'gap:14px;padding:24px;text-align:center;box-sizing:border-box;">' +
              '<p style="font-size:14px;color:#7C9095;">O app demorou demais pra carregar.</p>' +
              '<button id="btn-recarregar-forcado" style="background:#5CE1E6;' +
              'color:#04141A;border:none;border-radius:10px;padding:12px 20px;' +
              'font-weight:700;font-size:14px;">Recarregar app</button>' +
              "</div>";
            document.getElementById("btn-recarregar-forcado").onclick = function () {
              if (window.caches) {
                caches.keys().then(function (nomes) {
                  Promise.all(nomes.map(function (n) { return caches.delete(n); })).then(function () {
                    location.reload(true);
                  });
                });
              } else {
                location.reload(true);
              }
            };
          }
        }, 8000);

        // Tela branca ao VOLTAR pro app (não ao abrir pela primeira vez):
        // é um bug conhecido do Chrome/Android que às vezes trava o
        // repintar da tela depois que o app fica em segundo plano por um
        // tempo — o conteúdo está lá, só não é redesenhado na tela até
        // algo "cutucar" o navegador (por isso rolar a tela resolve).
        // Aqui a gente faz esse "cutucão" sozinho sempre que o app volta a
        // ficar visível: força um reflow (sem recarregar a página, então
        // não corre risco de perder uma gravação de vídeo em andamento).
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            requestAnimationFrame(function () {
              var raiz = document.getElementById("root");
              if (!raiz) return;
              var anterior = raiz.style.transform;
              raiz.style.transform = "translateZ(0)";
              void raiz.offsetHeight; // força o navegador a recalcular o layout agora
              raiz.style.transform = anterior || "";
            });
          }
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
